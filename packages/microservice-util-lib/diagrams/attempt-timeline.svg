<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" role="img"
  aria-label="Timeline of four failing retryWrapper attempts. Each attempt's calculateDelay call sets the duration of the wait one step ahead, not the wait immediately following it. The fourth attempt, with no retries left, skips shouldRetry, calculateDelay and onRetry and throws immediately.">
  <title>retryWrapper attempt timeline</title>
  <style>
    :root {
      --bg: #eef1f4;
      --surface: #ffffff;
      --ink: #1b2430;
      --muted: #56677a;
      --line: #c9d2db;
      --accent: #a8690f;
      --danger: #a5382a;
      --danger-soft: #e9b9ae;
      --ghost: #8b96a3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10151c;
        --surface: #171e27;
        --ink: #e4e9ee;
        --muted: #8a97a6;
        --line: #2b3542;
        --accent: #ffb300;
        --danger: #e2574c;
        --danger-soft: #4d241f;
        --ghost: #55606d;
      }
    }
    text {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    }
    .bg { fill: var(--surface); }
    .ax-line { stroke: var(--line); stroke-width: 1.5; }
    .bar { fill: var(--accent); }
    .bar-label { fill: var(--accent); font-size: 12px; font-weight: 600; text-anchor: middle; }
    .attempt-dot { fill: var(--danger); }
    .attempt-label { fill: var(--ink); font-size: 13px; font-weight: 700; text-anchor: middle; }
    .fails-label { fill: var(--danger); font-size: 11.5px; text-anchor: middle; }
    .pin-line { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
    .pin-text { fill: var(--ink); font-size: 11.5px; text-anchor: middle; }
    .pin-text.dim { fill: var(--muted); }
    .ghost-text { fill: var(--ghost); font-size: 11.5px; text-anchor: middle; text-decoration: line-through; }
    .ghost-note { fill: var(--ghost); font-size: 11px; text-anchor: middle; font-style: italic; }
    .retry-text { fill: var(--muted); font-size: 11.5px; text-anchor: middle; }
    .arc { fill: none; stroke: var(--accent); stroke-width: 1.4; opacity: 0.75; }
    .arc-ghost { fill: none; stroke: var(--ghost); stroke-width: 1.2; stroke-dasharray: 3 3; opacity: 0.8; }
    .ghost-dot { fill: var(--ghost); stroke: none; }
    .throw-box { fill: var(--danger-soft); stroke: var(--danger); stroke-width: 1.3; }
    .throw-text { fill: var(--danger); font-size: 12px; font-weight: 700; text-anchor: middle; }
    .axis-tick { fill: var(--muted); font-size: 11px; text-anchor: middle; }
    .legend-text { fill: var(--muted); font-size: 11px; }
  </style>

  <rect class="bg" x="0" y="0" width="1040" height="400" />

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--accent)" />
    </marker>
    <marker id="arrowhead-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--danger)" />
    </marker>
  </defs>

  <!-- forward-reference arcs: calculateDelay's output feeds the wait one step ahead -->
  <path class="arc" marker-end="url(#arrowhead)" d="M80,86 C 190,20 310,20 391,196" />
  <path class="arc" marker-end="url(#arrowhead)" d="M258,86 C 420,20 580,20 702,196" />
  <path class="arc-ghost" d="M524,86 C 760,6 930,6 940,196" />
  <circle cx="940" cy="199" r="3" class="ghost-dot" />

  <!-- pins above axis: shouldRetry + calculateDelay per attempt -->
  <line class="pin-line" x1="80" y1="92" x2="80" y2="160" />
  <text class="pin-text" x="80" y="108">shouldRetry(1) ✓</text>
  <text class="pin-text" x="80" y="124">calculateDelay(1)</text>
  <text class="pin-text dim" x="80" y="140">100ms → 150ms</text>

  <line class="pin-line" x1="258" y1="92" x2="258" y2="160" />
  <text class="pin-text" x="258" y="108">shouldRetry(2) ✓</text>
  <text class="pin-text" x="258" y="124">calculateDelay(2)</text>
  <text class="pin-text dim" x="258" y="140">150ms → 200ms</text>

  <line class="pin-line" x1="524" y1="92" x2="524" y2="160" />
  <text class="pin-text" x="524" y="108">shouldRetry(3) ✓</text>
  <text class="pin-text" x="524" y="124">calculateDelay(3)</text>
  <text class="pin-text dim" x="524" y="140">200ms → 250ms</text>

  <line class="pin-line" x1="880" y1="92" x2="880" y2="160" />
  <text class="ghost-text" x="880" y="108">shouldRetry(4)</text>
  <text class="ghost-text" x="880" y="124">calculateDelay(4)</text>
  <text class="ghost-note" x="880" y="140">skipped — retries ≤ 0</text>

  <!-- axis -->
  <line class="ax-line" x1="60" y1="200" x2="1000" y2="200" />

  <!-- delay bars, thickness encodes nothing extra — width already is duration -->
  <rect class="bar" x="80" y="196" width="178" height="8" />
  <text class="bar-label" x="169" y="188">100ms</text>

  <rect class="bar" x="258" y="196" width="266" height="8" />
  <text class="bar-label" x="391" y="188">150ms</text>

  <rect class="bar" x="524" y="196" width="356" height="8" />
  <text class="bar-label" x="702" y="188">200ms</text>

  <!-- attempt markers -->
  <circle class="attempt-dot" cx="80" cy="200" r="6" />
  <text class="attempt-label" x="80" y="176">Attempt 1</text>
  <text class="fails-label" x="80" y="232">✕ fails</text>

  <circle class="attempt-dot" cx="258" cy="200" r="6" />
  <text class="attempt-label" x="258" y="176">Attempt 2</text>
  <text class="fails-label" x="258" y="232">✕ fails</text>

  <circle class="attempt-dot" cx="524" cy="200" r="6" />
  <text class="attempt-label" x="524" y="176">Attempt 3</text>
  <text class="fails-label" x="524" y="232">✕ fails</text>

  <circle class="attempt-dot" cx="880" cy="200" r="6" />
  <text class="attempt-label" x="880" y="176">Attempt 4</text>
  <text class="fails-label" x="880" y="232">✕ fails</text>

  <!-- onRetry, reported at the attempt it precedes, with the delay actually waited -->
  <line class="pin-line" x1="258" y1="208" x2="258" y2="252" />
  <text class="retry-text" x="258" y="268">onRetry(1)</text>
  <text class="retry-text" x="258" y="282">delayMs=100</text>

  <line class="pin-line" x1="524" y1="208" x2="524" y2="252" />
  <text class="retry-text" x="524" y="268">onRetry(2)</text>
  <text class="retry-text" x="524" y="282">delayMs=150</text>

  <line class="pin-line" x1="880" y1="208" x2="880" y2="252" />
  <text class="retry-text" x="880" y="268">onRetry(3)</text>
  <text class="retry-text" x="880" y="282">delayMs=200</text>

  <!-- exhaustion -->
  <line class="ax-line" marker-end="url(#arrowhead-danger)" x1="895" y1="200" x2="960" y2="200" style="stroke:var(--danger)" />
  <rect class="throw-box" x="962" y="180" width="70" height="40" />
  <text class="throw-text" x="997" y="196">throw</text>
  <text class="throw-text" x="997" y="211" style="font-size:10px">retries≤0</text>

  <!-- elapsed time ticks -->
  <text class="axis-tick" x="80" y="330">t = 0ms</text>
  <text class="axis-tick" x="258" y="330">t = 100ms</text>
  <text class="axis-tick" x="524" y="330">t = 250ms</text>
  <text class="axis-tick" x="880" y="330">t = 450ms</text>

  <!-- legend -->
  <rect x="80" y="360" width="14" height="6" class="bar" />
  <text class="legend-text" x="100" y="368">delay (sleep duration)</text>

  <circle cx="330" cy="363" r="4" class="attempt-dot" />
  <text class="legend-text" x="342" y="368">attempt fails</text>

  <line x1="480" y1="363" x2="500" y2="363" class="arc-ghost" />
  <text class="legend-text" x="508" y="368">computed, never used</text>
</svg>
