name: Create new version release PR

on:
  push:
    branches:
      - release-pr/**

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-release:
    name: Check plan and Release new version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # Nx accepts several plans but merges them unpredictably, so a release must be cut from at most one.
      # Zero is allowed: a re-run after `nx release` consumed the plan must still be able to open the PR.
      # Runs before install so a bad branch fails in seconds. Counts every file because Nx reads them all.
      - name: 🛡️ Ensure at most one version plan
        run: |
          mapfile -t plans < <(find .nx/version-plans -maxdepth 1 -type f 2>/dev/null | sort)

          if [ "${#plans[@]}" -gt 1 ]; then
            echo "::error title=Multiple version plans::Found ${#plans[@]} version plans; a release-pr branch needs exactly one. Merge them into a single plan (highest bump per project, combined notes), delete the rest, commit to this branch and push again."
            printf '  - %s\n' "${plans[@]}"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Configure Dependency Cache
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: yarn install --immutable

      - name: ⚙️ Check for version plan
        run: yarn nx release plan:check --verbose

      - name: 📝 Release new version (skip publish)
        run: yarn nx release --skip-publish --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Create publish pull request
        run: |
          gh pr create --base main --head ${{ github.ref_name }} \
          --title "Chore: Publish packages" \
          --body $'Automated publish PR created by Nx Release workflow.\n- Version bumps\n- Updated changelogs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
