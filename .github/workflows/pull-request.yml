name: Pull request check

on: [pull_request]

permissions:
  actions: read
  contents: write

jobs:
  code-quality:
    name: 🕵️‍♀️ Code Quality Check
    if: ${{ !startsWith(github.head_ref, 'release-pr/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Fetch target
        run: git fetch origin ${{ env.BASE_REF  }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@dbe0650947e5f2c81f59190a38512cf49126fe6b # v4

      - name: ⚙️ Run Tests
        run: yarn nx affected -t typecheck lint test --parallel=2

      - name: ⚙️ Run Build
        run: yarn nx affected -t build

      - name: ⚙️ Run release plan check
        run: yarn nx release plan:check --verbose
